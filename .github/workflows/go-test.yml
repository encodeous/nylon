name: Go Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.3"

jobs:
  unit_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run unit test
        run: go run gotest.tools/gotestsum@latest -- --race -tags=router_test ./...
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run integration
        run: go run gotest.tools/gotestsum@latest -- --race -tags=integration ./integration/...
  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Get CPU core count
        id: cpu
        run: echo "cores=$(nproc)" >> $GITHUB_OUTPUT
      - name: Run e2e
        run: |
          go run gotest.tools/gotestsum@latest -- \
            -tags=e2e ./e2e/... \
            -parallel ${{ steps.cpu.outputs.cores }}
  e2e_cgo_disabled:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run CGO-disabled e2e smoke test
        env:
          CGO_ENABLED: "0"
        run: go run gotest.tools/gotestsum@latest -- -count=1 -tags=e2e ./e2e/... -run '^TestConnectivity$'
  e2e_windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Windows e2e dependencies
        run: |
          # Leave room for the installation ISOs, qcow2 and compressed Nix output.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf python3-venv unzip zstd
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            fallback = true
            connect-timeout = 5
            download-attempts = 1
            extra-system-features = kvm
      - name: Build Windows image
        id: windows_image
        env:
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PUBLISH_CACHE: ${{ github.event_name == 'push' }}
        run: |
          cache_args=()
          if [[ -n "$AWS_ACCESS_KEY_ID" ]]; then
            # Both the Nix daemon (reads) and nix copy (writes) need credentials.
            mkdir -p "$HOME/.aws"
            printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
              "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > "$HOME/.aws/credentials"
            chmod 600 "$HOME/.aws/credentials"
            sudo mkdir -p /root/.aws
            sudo install -m 600 "$HOME/.aws/credentials" /root/.aws/credentials
            # This private, authenticated bucket is trusted directly.
            cache="s3://nylon-ci-windows-image?endpoint=${AWS_ENDPOINT_URL_S3#https://}&region=auto&trusted=true"
            cache_args=(--option extra-substituters "$cache")
          fi
          nix build github:starcatmeow/nylon-ci-windows-image/main#nylon-ci-win2025 \
            --out-link "$RUNNER_TEMP/windows-image" --fallback "${cache_args[@]}"
          if [[ -n "$AWS_ACCESS_KEY_ID" && "$PUBLISH_CACHE" == true ]]; then
            # The output contains an already compressed qcow2; don't recompress it.
            nix copy --no-recursive --to "$cache&compression=none&multipart-upload=true" "$RUNNER_TEMP/windows-image" \
              || echo '::warning::Could not upload Windows image to the Nix cache'
          fi
          zstd -d "$RUNNER_TEMP/windows-image/nylon-ci-win2025.qcow2.zst" -o "$RUNNER_TEMP/windows.qcow2"
          echo "qcow2=$RUNNER_TEMP/windows.qcow2" >> "$GITHUB_OUTPUT"
      - name: Run Windows e2e
        run: e2e/windows/run.sh '${{ steps.windows_image.outputs.qcow2 }}'
      - name: Upload Windows e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-logs
          path: workdir/e2e/windows/**/*.log
